<form
  hx-get="{{ '/spec-docs/search/sem' if mode == 'sem' else '/spec-docs/search' }}"
  hx-target="#results"
  hx-trigger="submit"
  hx-swap="outerHTML"
  hx-indicator="#search-indicator"
  class="filters"
>
  <div class="search-grid-5">
    <label class="span-5">Query
      <input type="text" name="q" value="{{ query or '' }}" autofocus>
    </label>
  </div>
  {% if mode == 'sem' %}
    <div class="search-grid-5">
      <label class="span-5">FTS5 query
        <input type="text" name="fts5_query" value="{{ fts5_query or '' }}">
      </label>
    </div>
  {% endif %}
  <label>Spec
    <input type="text" name="spec" value="{{ filters.spec or '' }}">
  </label>
  <label>Release
    <input type="text" name="release" value="{{ filters.release or '' }}">
  </label>
  <label>Version
    <input type="text" name="version" value="{{ filters.version or '' }}">
  </label>
  <label>Sections
    <input type="text" name="sections" value="{{ filters.sections or '' }}">
  </label>
  <label>Tables
    <input type="text" name="tables" value="{{ filters.tables or '' }}">
  </label>
  {% if mode == 'sem' %}
    <label>FTS5 weight
      <input type="number" step="0.1" min="0" max="1" name="fts5_weight" value="{{ fts5_weight }}">
    </label>
  {% endif %}
  <label>Limit
    <input type="number" name="limit" value="{{ limit }}" min="1" max="200">
  </label>
  <button type="submit" class="btn">Search</button>
</form>
