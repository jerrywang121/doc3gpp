<form
  hx-get="/tdocs"
  hx-target="#results"
  hx-trigger="change, submit"
  hx-swap="outerHTML"
  class="filters"
>
  <label>TDoc
    <input type="text" name="tdoc_id" value="{{ filters.tdoc_id or '' }}">
  </label>
  <label>Meeting
    <input type="text" name="meeting" value="{{ filters.meeting or '' }}">
  </label>
  <label>Meeting ID
    <input type="number" name="meeting_id" value="{{ filters.meeting_id or '' }}">
  </label>
  <label>Title
    <input type="text" name="title" value="{{ filters.title or '' }}">
  </label>
  <label>Type
    <input type="text" name="type" value="{{ filters.type or '' }}">
  </label>
  <label>Source
    <input type="text" name="source" value="{{ filters.source or '' }}">
  </label>
  <label>Spec
    <input type="text" name="spec" value="{{ filters.spec or '' }}">
  </label>
  <label>WI
    <input type="text" name="wi" value="{{ filters.wi or '' }}">
  </label>
  <label>CR cat
    <input type="text" name="cr-cat" value="{{ filters.cr_cat or '' }}">
  </label>
  <label>Status
    <input type="text" name="status" value="{{ filters.status or '' }}">
  </label>
  <label>Revision of
    <input type="text" name="revision-of" value="{{ filters.revision_of or '' }}">
  </label>
  <label>Revised to
    <input type="text" name="revised-to" value="{{ filters.revised_to or '' }}">
  </label>
  <label>FTP URL
    <input type="text" name="ftp-url" value="{{ filters.ftp_url or '' }}">
  </label>
  <label>Release
    <input type="text" name="release" value="{{ filters.release or '' }}">
  </label>
  <label>Version
    <input type="text" name="version" value="{{ filters.version or '' }}">
  </label>
  <label>CR num
    <input type="text" name="cr-num" value="{{ filters.cr_num or '' }}">
  </label>
  <label>CR pack
    <input type="text" name="cr-pack" value="{{ filters.cr_pack or '' }}">
  </label>
  <label>Uploaded date
    <input type="text" name="uploaded-date" placeholder=">= 'YYYY-MM-DD'" value="{{ filters.uploaded_date or '' }}">
  </label>
  <label>Columns
    <select name="fields" multiple size="5">
      {% for key, label in column_labels.items() %}
        <option value="{{ key }}" {% if key in fields %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Limit
    <input type="number" name="limit" value="{{ filters.limit }}" min="1" max="200">
  </label>
  <input type="hidden" name="offset" value="0">
  <button type="submit" class="btn">Apply</button>
</form>
