[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "doc3gpp"
version = "0.1.0"
description = "Extract 3GPP TDoc information by scraping 3gpp.org"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "doc3gpp contributors" }]
dependencies = [
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.4",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.2",
  "openpyxl>=3.1.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
cli = ["typer>=0.12.3"]
extract = ["python-docx>=0.8.11"]
mysql = ["pymysql>=1.1.1"]
postgres = ["psycopg[binary]>=3.2.0"]
dev = [
  "doc3gpp[cli]",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
doc3gpp = "doc3gpp.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "online: tests that access live internet endpoints (for example 3gpp.org)",
  "mysql: tests that require a mysql backend",
]

[tool.ruff]
line-length = 100
target-version = "py310"
