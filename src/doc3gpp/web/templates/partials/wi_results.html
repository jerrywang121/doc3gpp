<div id="results" hx-target="this" hx-swap="outerHTML">
  {% if wis %}
    <table class="grid">
      <thead>
        <tr>
          <th>WI ID</th>
          <th>TSG</th>
          <th>Name</th>
          <th>Acronym</th>
          <th>Release</th>
        </tr>
      </thead>
      <tbody>
        {% for wi in wis %}
          <tr>
            <td><code>{{ wi.wi_id }}</code></td>
            <td><code>{{ wi.tsg_short }}</code></td>
            <td>{{ wi.name or '-' }}</td>
            <td>{{ wi.acronym or '-' }}</td>
            <td>{{ wi.release or '-' }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
    {% include "partials/pagination.html" %}
  {% else %}
    <p class="empty">No WIs match these filters.</p>
  {% endif %}
</div>
