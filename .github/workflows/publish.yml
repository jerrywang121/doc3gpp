name: Publish to TestPyPI

on:
  release:
    types: [published]

jobs:
  build-n-publish:
    name: Build and publish Python distro to TestPyPI
    runs-on: ubuntu-latest

    # environment + id-token: write are mandatory for Trusted Publishing (OIDC).
    # The "testpypi" environment must match what's registered at
    # https://test.pypi.org/manage/account/publishing/.
    environment:
      name: testpypi
      url: https://test.pypi.org/p/doc3gpp
    permissions:
      id-token: write  # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Inspect built artifacts
        run: ls -lh dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/