<form
  hx-get="/spec-docs/search"
  hx-target="#results"
  hx-trigger="submit"
  hx-swap="outerHTML"
  hx-indicator="#search-indicator"
  class="filters"
>
  <div class="search-grid-5">
    <label class="span-5" style="grid-column: span 5">Query
      <input type="text" name="text" value="{{ text or '' }}" autofocus>
    </label>
    <label class="span-5" style="grid-column: span 5">Semantic
      <input type="text" name="semantic" value="{{ semantic or '' }}">
    </label>
  </div>
  <label>Spec
    <input type="text" name="spec" value="{{ filters.spec or '' }}">
  </label>
  <label>Release
    <input type="text" name="release" value="{{ filters.release or '' }}">
  </label>
  <label>Version
    <input type="text" name="version" value="{{ filters.version or '' }}">
  </label>
  <label>Sections
    <input type="text" name="sections" value="{{ filters.sections or '' }}">
  </label>
  <label>Tables
    <input type="text" name="tables" value="{{ filters.tables or '' }}">
  </label>
  <label>Limit
    <input type="number" name="limit" value="{{ limit }}" min="1" max="200">
  </label>
  <button type="submit" class="btn">Search</button>
</form>
