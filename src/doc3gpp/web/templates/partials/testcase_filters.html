<form
  hx-get="/testcases"
  hx-target="#results"
  hx-trigger="change, submit"
  hx-swap="outerHTML"
  class="filters"
>
  <label>Testcase
    <input type="text" name="testcase" value="{{ filters.testcase or '' }}">
  </label>
  <label>Title
    <input type="text" name="title" value="{{ filters.title or '' }}">
  </label>
  <label>ATS
    <input type="text" name="ats" value="{{ filters.ats or '' }}">
  </label>
  <label>Feature
    <input type="text" name="feature" value="{{ filters.feature or '' }}">
  </label>
  <label>Release
    <input type="text" name="release" value="{{ filters.release or '' }}">
  </label>
  <label>WIs
    <input type="text" name="wis" value="{{ filters.wis or '' }}">
  </label>
  <label>Spec
    <input type="text" name="spec" value="{{ filters.spec or '' }}">
  </label>
  <label>Group
    <input type="text" name="group" value="{{ filters.group or '' }}">
  </label>
  <label>Status
    <input type="text" name="status" value="{{ filters.status or '' }}">
  </label>
  <label>GCF status
    <input type="text" name="gcf_status" value="{{ filters.gcf_status or '' }}">
  </label>
  <label>Limit
    <input type="number" name="limit" value="{{ filters.limit }}" min="1" max="200">
  </label>
  <input type="hidden" name="offset" value="0">
  <button type="submit" class="btn">Apply</button>
</form>
