[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "doc3gpp"
version = "0.1.1"
description = "Extract 3GPP TDoc information by scraping 3gpp.org"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "doc3gpp contributors" }]
keywords = [
  "3gpp",
  "tdoc",
  "scraping",
  "telecom",
  "3gpp-meetings",
  "3gpp-tdocs",
  "tsg",
  "wi",
  "dyna-report",
  "sqlalchemy",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.4",
  "httpx>=0.27.0,<1.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.2",
  "openpyxl>=3.1.0",
  "tomli>=2.0.1; python_version < '3.11'",
  "tomli_w>=1.0",
]

[project.urls]
Homepage = "https://github.com/jerrywang121/doc3gpp"
Repository = "https://github.com/jerrywang121/doc3gpp"
Issues = "https://github.com/jerrywang121/doc3gpp/issues"
Documentation = "https://github.com/jerrywang121/doc3gpp/tree/main/docs"
Changelog = "https://github.com/jerrywang121/doc3gpp/releases"

[project.optional-dependencies]
cli = ["typer>=0.12.3"]
extract = ["python-docx>=0.8.11"]
search = []
mysql = ["pymysql>=1.1.1"]
postgres = ["psycopg[binary]>=3.2.0"]
dev = [
  "doc3gpp[cli]",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
doc3gpp = "doc3gpp.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "online: tests that access live internet endpoints (for example 3gpp.org)",
  "mysql: tests that require a mysql backend",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel.force-include]
"src/doc3gpp/data/doc3gpp.toml.example" = "doc3gpp/data/doc3gpp.toml.example"

# Local-only symlinks (codegraph, opencode, serena, OMO plans) — without
# an explicit exclude hatchling follows them and bundles their contents
# into the sdist. See also .gitignore.
[tool.hatch.build.targets.sdist]
exclude = [
  ".codegraph",
  ".omo",
  ".opencode",
  ".serena",
  ".logs",
]
